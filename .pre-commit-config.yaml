repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^source/src/qt/nu/(app/repair_macos_qt_bundle\.py|tools/.*\.py)$
      - id: ruff-format
        files: ^source/src/qt/nu/(app/repair_macos_qt_bundle\.py|tools/.*\.py)$
